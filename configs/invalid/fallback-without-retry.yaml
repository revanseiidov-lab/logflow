# fallback yalnizca on-error: retry(n) ile birlikte kullanilabilir.
pipeline:
  source: { type: file, params: { path: data/access-small.log } }
  stages:
    - type: parse
    - type: project
      params: { fields: [timestamp, clientIp, status, path] }
  sink:
    type: console
    fallback: dead-letter
